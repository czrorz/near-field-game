:root{font-family:"Inhold Pixel","Microsoft YaHei",monospace;color:#303030;background:var(--surround);--ink:#303030;--surround:#e7e7e7;--paper:#f4f4f4;--red:#f00;--muted:#595959;--scrollbar-track:#bcbcbc;--scrollbar-size:6px}
*{box-sizing:border-box}body{margin:0}button,canvas,dialog{border:0;outline:none}button,canvas{-webkit-tap-highlight-color:transparent}button{appearance:none;font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}button:disabled{opacity:.42;cursor:default}[hidden]{display:none!important}
@supports selector(::-webkit-scrollbar){
  ::-webkit-scrollbar{width:var(--scrollbar-size);height:var(--scrollbar-size)}
  ::-webkit-scrollbar-track{background:var(--scrollbar-track)}
  ::-webkit-scrollbar-thumb{background:var(--muted);border-radius:0}
  ::-webkit-scrollbar-thumb:hover,::-webkit-scrollbar-thumb:active{background-color:var(--ink)}
  ::-webkit-scrollbar-button{display:none}
  ::-webkit-scrollbar-corner{background:transparent}
}
@supports not selector(::-webkit-scrollbar){
  :root{scrollbar-color:var(--muted) var(--scrollbar-track)}
  *{scrollbar-width:thin}
}
.game-scrollport{scrollbar-width:none}
.game-scrollport::-webkit-scrollbar{display:none}
.game-scrollbar{position:fixed;z-index:3;background:var(--scrollbar-track);pointer-events:auto;touch-action:none;user-select:none}
.game-scrollbar-thumb{position:absolute;inset:0 auto auto 0;background:var(--muted)}
.game-scrollbar-thumb:hover,.game-scrollbar[data-dragging] .game-scrollbar-thumb{background:var(--ink)}
@property --left-side{syntax:"<color>";inherits:false;initial-value:#dcdcdc}
@property --right-side{syntax:"<color>";inherits:false;initial-value:#dcdcdc}
#frame{position:relative;height:100dvh;width:100vw;overflow:hidden;--surround:#dcdcdc;--active-side:#e0e0e0;--left-side:var(--surround);--right-side:var(--surround);--arena-end:calc(var(--arena-start,50%) + var(--arena-w,0px));background:linear-gradient(to right,var(--left-side) var(--arena-start,50%),var(--surround) var(--arena-start,50%) var(--arena-end),var(--right-side) var(--arena-end));transition:--left-side var(--left-side-time,400ms) ease-in-out,--right-side var(--right-side-time,400ms) ease-in-out}
#frame[data-phase="battle"][data-side-flash="card"]{--left-side:var(--active-side);--left-side-time:120ms}#frame[data-phase="battle"][data-side-flash="enemy"]{--right-side:var(--active-side);--right-side-time:120ms}#sheet{position:absolute;left:var(--board-left);top:var(--board-top);width:var(--screen-w);height:var(--screen-h);container-type:inline-size}
#frame[data-phase="reward"]{background:var(--surround)}
#board{width:100%;height:100%;display:block;touch-action:none}
.anchor{position:absolute}#hud{z-index:1;top:var(--hud-top,8px);left:var(--hud-left,10px);width:var(--hud-width,264px);padding-top:env(safe-area-inset-top,0px);display:grid;gap:var(--hud-row-gap,7px);pointer-events:none}
.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.brand{font-size:32px;font-weight:400;line-height:1;color:#292929}
#utility{display:flex;flex-wrap:wrap;justify-content:flex-end;align-items:flex-start;min-width:0;gap:0 var(--hud-menu-gap,6px);pointer-events:auto}
.flat{flex:none;padding:4px 2px;background:transparent;color:var(--muted);font-size:16px;white-space:nowrap}
.flat:hover,.quiet:hover:not(:disabled),#equip-help:hover,#info button:hover,
.restart-choice:hover,.opening-mode .restart-choice:has(input:checked){text-decoration:underline;text-underline-offset:4px}
#metrics{display:grid;grid-template-columns:1fr auto 1fr;align-items:baseline;gap:4px;color:#555;font-size:16px;line-height:1.1}
.stat{min-width:0;font-variant-numeric:tabular-nums;white-space:nowrap}
#round-stat{display:flex;align-items:baseline;gap:2px;min-width:0}
#round-stat .stat{flex:none}
#undo-round{display:block;flex:none;width:25px;padding:4px 0;background:transparent;line-height:0;text-align:center;pointer-events:auto}
#undo-round svg{display:inline-block;width:.8125em;height:.625em;overflow:visible;vertical-align:baseline;pointer-events:none}
#undo-round:disabled{opacity:1}
#undo-round .undo-underline{visibility:hidden}
#undo-round:hover .undo-underline{visibility:visible}
#undo-round:focus-visible{outline:1px solid currentColor}
#usage{text-align:right}
#footer{top:var(--settle-top);left:var(--arena-left);width:var(--arena-w);text-align:center;pointer-events:none}
.action{background:#333;color:#fff;padding:9px 20px;font-size:13px}.action:hover:not(:disabled){background:#505050}.action:active:not(:disabled){transform:translateY(1px)}

const key = (x, y) => x + ',' + y;
function normalize(cells) {
  if (!cells.length) return [];
  let left = Infinity, top = Infinity;
  const unique = new Map();
  for (const [x, y] of cells) {
    left = Math.min(left, x);
    top = Math.min(top, y);
    unique.set(key(x, y), [x, y]);
  }
  return [...unique.values()].map(([x, y]) => [x - left, y - top])
    .sort((a, b) => a[1] - b[1] || a[0] - b[0]);
}

function bounds(cells) {
  if (!cells.length) return { w: 0, h: 0 };
  let left = Infinity, top = Infinity, right = -Infinity, bottom = -Infinity;
  for (const [x, y] of cells) {
    left = Math.min(left, x); right = Math.max(right, x);
    top = Math.min(top, y); bottom = Math.max(bottom, y);
  }
  return { w: right - left + 1, h: bottom - top + 1 };
}

  if (typeof seed === 'number' && Number.isFinite(seed)) return seed >>> 0;

const clamp = (n, a, b) => Math.max(a, Math.min(b, n));
const randomItem = (items, rng) => items[Math.floor(rng() * items.length)];
const rangeInt = (a,b,rng) => a+Math.floor(rng()*(b-a+1));
const giftSpan = round => 3 + Math.ceil((round - 1) * (MAX_PIECE_SPAN - 3) / (ROUNDS - 1));
const fragmentArea = (round,gameMode) => gameMode==='standard' ? Math.min(3,Math.ceil(round/5)) : round<=8 ? 3 : 4;
const deployLimit = round => 2 + Math.floor((round - 1) / 5);
const inDefense = (x,y) => x >= FIELD.x && y >= FIELD.y && x < FIELD.x+FIELD.size && y < FIELD.y+FIELD.size;
const weighted = (items, rng) => {
  let value = rng()*items.reduce((sum,item) => sum+item.weight,0);
  for (const item of items) {
    value -= item.weight;
    if (value < 0) return item;
  }
  return items.at(-1);
};

function walk(area, maxSpan, rng, material=false, branchRate=.24, straightness=5) {
  const steps=material ? CARDINAL : STEPS;
  const cells = [[0,0]], occupied = new Set(['0,0']);
  let minX=0,maxX=0,minY=0,maxY=0, direction=-1;
  const options = ([x,y], preferred) => {
    const result = [];
    for (let i=0;i<steps.length;i++) {
      const xx=x+steps[i][0], yy=y+steps[i][1], id=key(xx,yy);
      if (occupied.has(id) || Math.max(maxX,xx)-Math.min(minX,xx)>=maxSpan ||
          Math.max(maxY,yy)-Math.min(minY,yy)>=maxSpan) continue;
      const diff=Math.min((i-preferred+steps.length)%steps.length,(preferred-i+steps.length)%steps.length);
      result.push({xx,yy,id,i,weight:preferred<0 ? 1 : diff===0 ? straightness : diff===1 ? 2.1 : .6});
    }
    return result;
  };
  while (cells.length < area) {
    const branch=rng()<branchRate;
    let available=options(branch ? randomItem(cells,rng) : cells.at(-1),branch ? -1 : direction);
    if (!available.length) {
      const starts=cells.map(cell=>options(cell,-1)).filter(choices=>choices.length);
      if (!starts.length) break;
      available=material ? starts.flat() : randomItem(starts,rng);
    }
    const {xx,yy,id,i}=weighted(available,rng);
    cells.push([xx,yy]); occupied.add(id); direction=i;
    minX=Math.min(minX,xx); maxX=Math.max(maxX,xx);
    minY=Math.min(minY,yy); maxY=Math.max(maxY,yy);
  }
  return normalize(cells);
}

function rolledShape(area,span,target,rng,split=false,material=false) {
  let best, bestScore=Infinity;
  for (let attempt=0;attempt<26;attempt++) {
    let cells=walk(area,span,rng,material,.08+rng()*.36,3+rng()*9);
    if (split && area>=8) {
      const first=rangeInt(Math.ceil(area*.42),Math.ceil(area*.63),rng);
      const a=walk(first,span,rng,false,.23,6), b=walk(area-first,span,rng,false,.2,7);
      const offset=bounds(a).w + rangeInt(1,4,rng);
      const shift=rangeInt(-2,3,rng);
      const combined=normalize(a.concat(b.map(([x,y]) => [x+offset,y+shift])));
      const shapeBox=bounds(combined);
      if (shapeBox.w<=span && shapeBox.h<=span) cells=combined;
      else if (attempt<20) continue;
    }
    const {w,h}=bounds(cells);
    if (cells.length!==area) continue;
    const score=Math.abs(Math.log((area/(w*h))/target)) + rng()*.035;
    if (score<bestScore) {best=cells;bestScore=score;}
    if (score<.06 && attempt>=4) break;
  }
  return best || walk(area,span,rng,material);
}

function enemyGroups(round,rng,area) {
  const min=round<=8?2:round<=15?3:4;
  const max=round<=4?2:round<=8?3:round<=12?4:round<=16?5:6;
  const count=rangeInt(min,max,rng);
  const weights=Array.from({length:count},(_,i)=>.72+rng()*.8+(i===0 && rng()<.72 ? .8 : 0));
  const sum=weights.reduce((a,b)=>a+b,0);
  const groups=weights.map(weight=>3+Math.floor((area-count*3)*weight/sum));
  while (groups.reduce((a,b)=>a+b,0)<area) groups[rangeInt(0,count-1,rng)]++;
  return groups.sort((a,b)=>b-a);
}

function potionCell(piece, x, y) {
  const id=key(x,y);
  return {x,y,source:id,mark:piece.marks?.[id],double:piece.double?.has(id) ?? false,
    pickup:piece.pickups?.get(id)};
}

function potionCoordinates(records) {
  if (!records.length) return {cells:[],marks:{},double:new Set(),sources:new Map(),pickups:new Map(),dx:0,dy:0};
  const dx=Math.min(...records.map(cell=>cell.x));
  const dy=Math.min(...records.map(cell=>cell.y));
  const cells=records.map(({x,y})=>[x-dx,y-dy]);
  cells.sort(([ax,ay],[bx,by])=>ay-by||ax-bx);
  const marks={};
  const double=new Set();
  const sources=new Map();
  const pickups=new Map();
  for (const cell of records) {
    const id=key(cell.x-dx,cell.y-dy);
    if (cell.mark) marks[id]=cell.mark;
    if (cell.double) double.add(id);
    if (cell.source!==undefined) sources.set(id,cell.source);
    if (cell.pickup) pickups.set(id,cell.pickup);
  }
  return {cells,marks,double,sources,pickups,dx,dy};
}

function potionSolidify(cells, strong) {
  const left=Math.min(...cells.map(cell=>cell.x));
  const right=Math.max(...cells.map(cell=>cell.x));
  const top=Math.min(...cells.map(cell=>cell.y));
  const bottom=Math.max(...cells.map(cell=>cell.y));
  const occupied=new Set(cells.map(({x,y})=>key(x,y)));
  const outside=new Set();
  const rows=new Map();
  const columns=new Map();
  if (strong) {
    for (const {x,y} of cells) {
      const row=rows.get(y)??[x,x];
      const column=columns.get(x)??[y,y];
      rows.set(y,[Math.min(row[0],x),Math.max(row[1],x)]);
      columns.set(x,[Math.min(column[0],y),Math.max(column[1],y)]);
    }
  } else {
    // Flood from a one-cell margin so open notches stay open.
    const queue=[[left-1,top-1]];
    outside.add(key(...queue[0]));
    for (let i=0;i<queue.length;i++) {
      const [x,y]=queue[i];
      for (const [dx,dy] of CARDINAL) {
        const xx=x+dx, yy=y+dy, id=key(xx,yy);
        if (xx<left-1||xx>right+1||yy<top-1||yy>bottom+1||occupied.has(id)||outside.has(id)) continue;
        queue.push([xx,yy]);
        outside.add(id);
      }
    }
  }
  const result=[...cells];
  for (let y=top;y<=bottom;y++) for (let x=left;x<=right;x++) {
    const id=key(x,y);
    if (occupied.has(id)) continue;
    if (strong) {
      const row=rows.get(y), column=columns.get(x);
      const between=(row&&x>row[0]&&x<row[1])||(column&&y>column[0]&&y<column[1]);
      if (between) result.push({x,y});
    } else if (!outside.has(id)) {
      result.push({x,y});
    }
  }
  return result;
}

function potionLife(cells, original) {
  const neighborCounts=new Map();
  for (const {x,y} of cells) for (const [dx,dy] of STEPS) {
    const xx=x+dx, yy=y+dy, id=key(xx,yy);
    const neighbor=neighborCounts.get(id);
    if (neighbor) neighbor.count++;
    else neighborCounts.set(id,{x:xx,y:yy,count:1});
  }
  const result=[];
  for (const [id,{x,y,count}] of neighborCounts) {
    const existing=original.get(id);
    if (count===3||(count===2&&existing)) result.push(existing??{x,y});
  }
  return result;
}

function potionAlign(cells, side) {
  const horizontal=side==='left'||side==='right';
  const reverse=side==='right'||side==='bottom';
  const fixed=horizontal?'y':'x', moving=horizontal?'x':'y';
  const values=cells.map(cell=>cell[moving]);
  const border=reverse?Math.max(...values):Math.min(...values);
  const lines=new Map();
  for (const cell of cells) {
    if (!lines.has(cell[fixed])) lines.set(cell[fixed],[]);
    lines.get(cell[fixed]).push(cell);
  }
  const result=[];
  for (const line of lines.values()) {
    line.sort((a,b)=>a[moving]-b[moving]);
    const start=reverse?border-line.length+1:border;
    line.forEach((cell,index)=>result.push({...cell,[moving]:start+index}));
  }
  return result;
}

function potionShape(id, piece, option={},offset) {
  if (!piece?.cells.length) return null;
  const {x:offsetX,y:offsetY}=offset??pieceSlotOffset(piece,piece.home);
  const frame={x:-offsetX,y:-offsetY};
  const cells=piece.cells.map(([x,y])=>potionCell(piece,x,y));
  const original=new Map(cells.map(cell=>[key(cell.x,cell.y),cell]));
  let result;
  switch (id) {
    case 'cut': {
      const {axis,line,before}=option;
      if (!['x','y'].includes(axis)||!Number.isInteger(line)) return null;
      result=cells.filter(cell=>(cell[axis]<line)===before);
      break;
    }
    case 'shift': {
      const {dx,dy}=option;
      if (!Number.isInteger(dx)||!Number.isInteger(dy)||Math.abs(dx)>1||Math.abs(dy)>1||(!dx&&!dy)) return null;
      const union=new Map(original);
      for (const cell of cells) {
        const x=cell.x+dx,y=cell.y+dy,id=key(x,y);
        if (inSlotFrame(frame,x,y)&&!union.has(id)) union.set(id,{x,y});
      }
      result=[...union.values()];
      break;
    }
    case 'solidify':
    case 'strong':
      result=potionSolidify(cells,id==='strong');
      break;
    case 'life':
      result=potionLife(cells,original).filter(({x,y})=>inSlotFrame(frame,x,y));
      break;
    case 'difference': {
      const differences=new Map();
      for (const a of cells) for (const b of cells) {
        const x=a.x-b.x,y=a.y-b.y;
        if (x<0||y<0) continue;
        const id=key(x,y);
        differences.set(id,original.get(id)??{x,y});
      }
      result=[...differences.values()];
      break;
    }
    case 'align':
      if (!['left','right','top','bottom'].includes(option.side)) return null;
      result=potionAlign(cells,option.side);
      break;
    case 'turn': {
      const {turns=0,mirror=false}=option;
      if (!Number.isInteger(turns)) return null;
      const quarters=((turns%4)+4)%4;
      const last=MAX_PIECE_SPAN-1;
      result=cells.map(cell=>{
        let x=cell.x-frame.x, y=cell.y-frame.y;
        if (mirror) x=last-x;
        for (let i=0;i<quarters;i++) [x,y]=[last-y,x];
        return {...cell,x:x+frame.x,y:y+frame.y};
      });
      return potionCoordinates(result);
    }
    default:
      return null;
  }
  if (!result.length) return id==='life'&&piece.kind==='enemy'?potionCoordinates(result):null;
  const unchanged=result.length===cells.length&&result.every(cell=>{
    const prior=original.get(key(cell.x,cell.y));
    return prior&&prior.mark===cell.mark&&prior.pickup===cell.pickup&&Boolean(prior.double)===Boolean(cell.double);
  });
  return unchanged?null:potionCoordinates(result);
}

function potionOverlay(a,b,delta={},operation='intersection') {
  const {dx=0,dy=0}=delta;
  if (!Number.isInteger(dx)||!Number.isInteger(dy)||!['intersection','xor'].includes(operation)) return null;
  const toMap=(piece,px,py)=>new Map(piece.cells.map(([x,y])=>{
    const cell=potionCell(piece,x,y);
    return [key(x+px,y+py),{...cell,x:x+px,y:y+py}];
  }));
  const first=toMap(a,a.x,a.y);
  const second=toMap(b,b.x+dx,b.y+dy);
  const cells=[];
  if (operation==='intersection') {
    for (const [id,cell] of first) {
      const partner=second.get(id);
      if (partner) cells.push({x:cell.x,y:cell.y,double:cell.double||partner.double});
    }
    if (!cells.length) return null;
  } else {
    for (const [id,cell] of first) if (!second.has(id)) cells.push(cell);
    for (const [id,cell] of second) if (!first.has(id)) cells.push(cell);
    if (cells.length===first.size+second.size) return null;
  }
  const {cells:shape,marks,double,pickups,dx:x,dy:y}=potionCoordinates(cells);
  return {cells:shape,marks,double,pickups,x:cells.length?x:a.x,y:cells.length?y:a.y};
}

function potionCardMap(pieces) {
  const coverage=new Map();
  for (const piece of pieces) {
    if (piece.kind!=='card'||piece.inactive||piece.banned||piece.free) continue;
    for (const [x,y] of piece.cells) {
      const xx=x+piece.x,yy=y+piece.y;
      if (!inDefense(xx,yy)) continue;
      const id=key(xx,yy);
      if (!coverage.has(id)) coverage.set(id,[]);
      coverage.get(id).push({piece,xx,yy});
    }
  }
  return coverage;
}

function potionSurround(pieces) {
  const coverage=potionCardMap(pieces);
  const visited=new Set();
  const result=[];
  for (let y=FIELD.y;y<FIELD.y+FIELD.size;y++) for (let x=FIELD.x;x<FIELD.x+FIELD.size;x++) {
    const start=key(x,y);
    if (visited.has(start)||coverage.has(start)) continue;
    const queue=[[x,y]];
    const borderCards=new Set();
    visited.add(start);
    let open=false;
    for (let i=0;i<queue.length;i++) {
      const [cx,cy]=queue[i];
      for (const [dx,dy] of CARDINAL) {
        const xx=cx+dx,yy=cy+dy;
        if (!inDefense(xx,yy)) {
          open=true;
          continue;
        }
        const id=key(xx,yy);
        const edge=coverage.get(id);
        if (edge) {
          for (const {piece} of edge) borderCards.add(piece.id);
        } else if (!visited.has(id)) {
          queue.push([xx,yy]);
          visited.add(id);
        }
      }
    }
    if (!open&&borderCards.size>=2) result.push(...queue);
  }
  return result;
}

function potionSharedEdges(pieces) {
  const coverage=potionCardMap(pieces);
  const result=[];
  for (const owners of coverage.values()) {
    const {xx,yy}=owners[0];
    // Each board edge is tested once and must be an outside side of both pieces.
    for (const [dx,dy] of [[1,0],[0,1]]) {
      const adjacent=coverage.get(key(xx+dx,yy+dy));
      if (!adjacent) continue;
      const endsHere=owners.some(({piece})=>!adjacent.some(owner=>owner.piece.id===piece.id));
      const endsThere=adjacent.some(({piece})=>!owners.some(owner=>owner.piece.id===piece.id));
      if (endsHere&&endsThere) result.push([xx,yy,dx,dy]);
    }
  }
  return result;
}

function retainedEdgeCells(edges=[]) {
  return edges.flatMap(([x,y,dx,dy])=>[[x,y],[x+dx,y+dy]]);
}

function rollPotions(state) {
  const {round,seed}=state;
  if (round<2||round>=ROUNDS) return [];
  const oddRound=round%2!==0;
  if (oddRound&&(state.gameMode!=='advanced'||round<13)) return [];
  const pool=Object.keys(POTIONS);
  const rng=generator(seed,round,39);
  const count=oddRound ? 1 : round>=16 ? 3 : round>=10 ? 2 : 1;
  return Array.from({length:count},()=>randomItem(pool,rng));
}

function openPotion(id,index) {

  if (potionChoice?.id===id) { discardPotion();return; }
  if (run.phase!=='battle' && !(run.phase==='reward'&&id==='scout')) return;
  potionChoice={index,id,targets:[],option:null,plan:null};
  if (POTIONS[id].overlap) potionChoice.placed=[];

  refresh();
}

  if (redraw) refresh();
}
function canPermanentlyChangeCard(piece,base) {
  if (run.temporarilyChangedCards?.has(base.id)||piece.sourceId) return false;
  // Older saves contain the cell mapping but no record of confirmed temporary changes.
  if (!piece.sourceCells) return true;
  return piece.cells.length===base.cells.length&&piece.cells.every(cell=>{
    const id=key(...cell);
    return piece.sourceCells.get(id)===id;

function eligiblePotionTarget(piece) {
  const {id,targets}=potionChoice, spec=POTIONS[id];
  if (piece.inactive||piece.banned||piece.free||!piece.cells.length) return false;
  if (spec.kind!=='both'&&piece.kind!==spec.kind) return false;
  if (id==='fillEnemy') return Object.values(piece.marks??{}).includes('hollow');
  if (id==='sideSwap') {
    return targets.every(target=>target===piece.id||
      run.pieces.find(candidate=>candidate.id===target)?.kind!==piece.kind);
  }
  if (id==='nextEnemy') return run.round<ROUNDS;
  const turnBlackCard=id==='turn'&&piece.kind==='card'&&!piece.swapped;
  if (!spec.editor&&!turnBlackCard) return true;
  const source=piece.sourceId??piece.id, base=run.cards.find(card=>card.id===source);
  if (!base||piece.swapped||!canPermanentlyChangeCard(piece,base)) return false;
  if (turnBlackCard) return true;
  return base.cells.length>=(id==='exchange'?EXCHANGE_SIZE:1)&&
    targets.every(target=>target===piece.id||
      (run.pieces.find(candidate=>candidate.id===target)?.sourceId??target)!==source);
}
function cutTarget() {
  if (potionChoice?.id!=='cut') return;
  return run.pieces.find(piece=>piece.id===potionChoice.targets[0]);
}

function potionFrame(piece,atHome=false) {

  const {x,y}=slotOrigin(piece.slot,isEnemy,isEnemy?maxTrayOffset:trayOffset);

  const frame=potionFrame(piece,true);
  const start=frame[axis]-piece.home[axis];
  return clamp(line,start+1,start+MAX_PIECE_SPAN-1);
}

  const coordinate=axis==='x'?0:1;
  const values=piece.cells.map(cell=>cell[coordinate]);
  const center=Math.floor((Math.min(...values)+Math.max(...values)+1)/2);
  return {axis,line:clampCutLine(piece,axis,center)};
}
function moveCutLine(piece,line) {
  const {axis,line:current}=potionChoice.option;
  const next=clampCutLine(piece,axis,line);
  if (next!==current) potionOption({axis,line:next});
}

  const position=potionChoice.option.axis==='x'?x-piece.home.x:y-piece.home.y;
  moveCutLine(piece,Math.round(position));

function potionTargetAt(x,y,event) {
  if (!potionChoice) return false;
  const {id,targets:selectedTargets}=potionChoice;
  const spec=POTIONS[id];
  if (spec.overlap) return startOverlapDrag(x,y,event);
  if (id==='exchange'&&potionChoice.edit) return exchangeAt(x,y,event);
  if (id==='moveCell'&&potionChoice.edit) {
    if (!moveCellAt(x,y)) discardPotion();
    return true;
  }
  if (!spec.kind) {
    // Formation potions still let their pieces be dragged into position.
    if ((id==='surround'||id==='edge')&&targetsAt(x,y).candidates.length) return false;
    discardPotion();
    return true;
  }
  if (potionChoice.cutPointer!==undefined) return true;
  const candidates=run.pieces.filter(piece=>eligiblePotionTarget(piece)&&!selectedTargets.includes(piece.id));
  // Prefer the card's own bounds when its outer frame overlaps another frame.
  const hits=candidates.filter(piece=>hit(piece,x,y));
  const direct=hits.findLast(piece=>piece.kind===mode)??hits.at(-1);
  const pieceToCut=cutTarget();
  if (pieceToCut&&inSlotFrame(potionFrame(pieceToCut,true),x,y)) {
    if (event) {
      potionChoice.cutPointer=event.pointerId;
      canvas.setPointerCapture(event.pointerId);
    }
    moveCutLineAt(pieceToCut,x,y);
    return true;
  }
  const keepSelection=run.pieces.some(piece=>selectedTargets.includes(piece.id)&&
    inSlotFrame(potionFrame(piece,potionPreviewAtHome()),x,y));
  if (!direct&&keepSelection) return true;
  const next=direct??candidates.findLast(piece=>inSlotFrame(potionFrame(piece),x,y)||
    ((spec.kind==='both'||spec.editor)&&inSlotFrame(potionFrame(piece,true),x,y)));
  if (!next) {
    const displayed=potionChoice.plan?.pieces??run.pieces;
    const clickedPreview=displayed.some(piece=>!piece.inactive&&hit(piece,x,y)&&
      (selectedTargets.includes(piece.id)||!run.pieces.some(original=>original.id===piece.id)));
    if (!clickedPreview) discardPotion();
    return true;
  }

  const previous=selectedTargets.at(-1);
  const cutAxis=potionChoice.option?.axis;
  potionChoice.targets=spec.count===2&&previous ? [previous,next.id] : [next.id];
  potionChoice.option=null;
  if (id==='cut') potionChoice.option=centeredCut(next,cutAxis??'x');
  if (spec.editor&&potionChoice.targets.length===(spec.count??1)) beginPotionEdit();
  else refresh();
  return true;
}

function potionOption(option) {

  refresh();
}
function potionKey(event) {
  const piece=cutTarget();
  const steps={ArrowLeft:['x',-1],ArrowRight:['x',1],ArrowUp:['y',-1],ArrowDown:['y',1]};
  const step=steps[event.key];
  if (!piece||!step) return false;
  event.preventDefault();
  const {axis,line}=potionChoice.option;
  if (axis===step[0]) moveCutLine(piece,line+step[1]);
  return true;
}

function overlapPieces() {
  const {placed,overlapDrag}=potionChoice;
  const positions=overlapDrag?placed.filter(piece=>piece.id!==overlapDrag.tile.id).concat(overlapDrag.tile):placed;
  return positions.map(position=>({...run.pieces.find(piece=>piece.id===position.id),...position}));
}
function startOverlapDrag(x,y,event) {
  const {id,placed,overlapTop,overlapDrag}=potionChoice;
  if (overlapDrag) return true;
  if (id==='xor'? x<FIELD.x : x>=FIELD.x+FIELD.size) {
    discardPotion();
    return true;
  }
  const hits=overlapPieces().filter(piece=>hitSolid(piece,x,y));
  let piece=hits.find(candidate=>candidate.id===overlapTop)??hits.at(-1);
  if (!piece&&placed.length<2) {
    const candidates=run.pieces.filter(candidate=>eligiblePotionTarget(candidate)&&!placed.some(position=>position.id===candidate.id));
    piece=candidates.findLast(candidate=>hitSolid(candidate,x,y))??
      candidates.findLast(candidate=>hit(candidate,x,y)||inSlotFrame(potionFrame(candidate),x,y));
  }
  if (piece) {
    potionChoice.overlapDrag={pointer:event.pointerId,tile:{id:piece.id,x:piece.x,y:piece.y},
      origin:[piece.x,piece.y],start:[x,y],alternate:hits.find(candidate=>candidate.id!==piece.id)?.id};
    canvas.setPointerCapture(event.pointerId);
    refresh();
  }
  return true;
}

  const [x,y]=point(event,canvas,unit);
  tile.x=origin[0]+Math.round(x-start[0]);
  tile.y=origin[1]+Math.round(y-start[1]);
}

  const choice=potionChoice;

  if (event.type==='pointerup') {
    moveOverlapDrag(event);
    const [x,y]=point(event,canvas,unit);
    const piece=run.pieces.find(candidate=>candidate.id===tile.id);
    const index=choice.placed.findIndex(position=>position.id===tile.id);
    if (index>=0&&tile.x===origin[0]&&tile.y===origin[1]&&alternate) {
      choice.overlapTop=alternate;
    } else if (piece.cells.every(([u,v])=>inDefense(tile.x+u,tile.y+v))) {
      if (index<0) choice.placed.push(tile);
      else choice.placed[index]=tile;
      choice.overlapTop=tile.id;
    } else if (index>=0&&!inDefense(x,y)) {

function drawOverlapPreview() {

  for (const piece of pieces) {

  const color=enemy?enemyPaint.normal.stack:upgradeColors.overlap;
  for (const [u,v] of overlap.cells) {

    if (!inDefense(x,y)) continue;
    const hollow=enemy&&pieces.every(piece=>pieceCellType(piece,x-piece.x,y-piece.y)==='hollow');
    if (hollow) drawCellRim(x,y,color);
    else {
      ctx.fillStyle=color;
      square(ctx,x,y,unit,pixelRatio);

    if (original!==undefined) sources.set(target,original);

  const [card]=potionChoice.edit.cards;
  const {draft}=potionChoice.edit;
  const local=[Math.floor(x)-anchor.x,Math.floor(y)-anchor.y];
  const occupied=card.cells.some(([u,v])=>u===local[0]&&v===local[1]);
  if (occupied) {
    if (draft.to||draft.from?.[0]!==local[0]||draft.from?.[1]!==local[1]) {
      draft.from=local;
      draft.to=null;
      refresh();
    }
  } else if (draft.from&&(draft.to?.[0]!==local[0]||draft.to?.[1]!==local[1])) {
    draft.to=local;

  }

}
function drawMoveCell() {
  const {frame,anchor}=moveCellSlot();

    ctx.fillRect(frame.x*unit,(frame.y+i)*unit,size,pixel);

  drawSlotFrame(frame);
  for (const [x,y] of card.cells) {
    const picked=x===from?.[0]&&y===from?.[1];
    if (picked&&to) continue;
    ctx.fillStyle=picked?MOVE_CELL_SOURCE_COLOR:'#737373';
    square(ctx,anchor.x+x,anchor.y+y,unit,pixelRatio);
    boardCursorCells.add(key(anchor.x+x,anchor.y+y));
    if (card.double?.has(key(x,y))) {
      ctx.fillStyle='#bcbcbc';
      drawMark(anchor.x+x,anchor.y+y,unit*.32);

  }
  if (to) {
    ctx.fillStyle=MOVE_CELL_DESTINATION_COLOR;

    boardCursorCells.add(key(anchor.x+to[0],anchor.y+to[1]));
    if (card.double?.has(key(...from))) {

    }
  }
}

function updateEquipment() {
  const tray=$('equipment'), action=$('equip-action');
  const playing=['battle','reward'].includes(run.phase);
  tray.hidden=!playing;
  const choice=playing ? potionChoice : null;
  if (!playing) return;
  const left=$('equip-potions'), right=$('equip-potions-right'), skills=$('equip-skills');
  const {leftColumns,rightColumns,iconPixels}=potionRailLayout;
  const stamp=JSON.stringify([run.round,run.phase,language,locked,run.potions,leftColumns,rightColumns,iconPixels,[...(run.scoutedRounds??[])],
    choice&&[choice.id,choice.targets,choice.option,Boolean(choice.plan)]]);
  if (stamp===gearStamp) return;
  gearStamp=stamp;
  skills.setAttribute('aria-label',gearText('skills'));
  const stacks=new Map();
  run.potions.forEach((id,index)=>{
    const stack=stacks.get(id);
    if (stack) stack.count++;
    else stacks.set(id,{index,count:1});
  });
  const items=Array.from(stacks);
  if (upcomingScoutRounds().some(round=>run.scoutedRounds.has(round))) {
    const scout=stacks.get('scout')??{index:-1,count:0};
    const position=items.findIndex(([id])=>id==='scout');
    if (position>=0) items.splice(position,1);
    items.splice(run.scoutSlot??(position>=0?position:items.length),0,['scout',scout]);
  }
  const buttons=items.map(([id,{index,count}])=>{
    const label=POTIONS[id][gearLanguage()][0];
    const needsFuture=id==='scout'||id==='nextEnemy';
    return equipButton(label,()=>openPotion(id,index),{
      potion:id,pixels:iconPixels,active:choice?.id===id,count,
      title:count===1?label:label+' ×'+count,
      disabled:locked||(run.phase!=='battle'&&id!=='scout')||(needsFuture&&run.round>=ROUNDS)
    });
  });
  const leftCount=leftColumns*2;
  for (const [list,sideButtons,columns] of [[left,buttons.slice(0,leftCount),leftColumns],[right,buttons.slice(leftCount),rightColumns]]) {
    list.setAttribute('aria-label',gearText('potions'));
    list.style.setProperty('--potion-columns',Math.max(1,columns));
    list.replaceChildren(...sideButtons);
    snapPotionIcons(list);
  }
  skills.replaceChildren(...Object.entries(SKILL_ROUNDS).map(([id,unlock])=>{
    const label=gearText(id);
    const button=equipButton(label,()=>showInfo('skillsGear',[label],[['close']]),{icon:SKILL_ICONS[id],title:run.round<unlock?gearRound(unlock)+' · '+label:label});
    button.classList.toggle('equip-locked',run.round<unlock);
    return button;
  }));
  action.hidden=!choice;
  if (!choice) return;
  const buttonIndex=items.findIndex(([id])=>id===choice.id);
  action.dataset.side=buttonIndex>=leftCount?'right':'left';
  const spec=POTIONS[choice.id], [title,details]=spec[gearLanguage()];
  const card=$('equip-card');
  card.dataset.rows=spec.optionRows??0;
  card.toggleAttribute('data-scout',choice.id==='scout');
  $('equip-title').textContent=title;
  $('equip-description').textContent=details;
  $('equip-help').setAttribute('aria-label',gearText('potionHelp'));
  const choices=potionOptions();
  const options=$('equip-options');
  options.dataset.layout=choice.id==='scout'?'three':choices.length===8?'four':'auto';
  options.replaceChildren(...choices);
  const selecting=spec.kind&&choice.targets.length<(spec.count??1);
  let prompt=choice.plan?'':gearText('noResult');
  if (selecting) {
    if (spec.overlap) prompt=editText(choice.id==='xor'?'dragEnemy':'drag');
    else if (choice.id==='sideSwap'&&choice.targets.length) {
      const first=run.pieces.find(piece=>piece.id===choice.targets[0]);
      prompt=gearText(first?.kind==='card'?'pickEnemy':'pickCard');
    } else if (choice.targets.length) prompt=gearText('another');
    else if (spec.kind==='both') prompt=editText('pick');
    else prompt=gearText(spec.kind==='card'?'pickCard':'pickEnemy');
  } else if (choice.id==='scout') {
    prompt=gearText('chooseFuture');
  } else if (choice.id==='cut') {
    prompt=gearText(choice.plan?'cutLine':'noResult');
  } else if (choice.id==='moveCell'&&!choice.plan) {
    prompt=editText('move');
  } else if (choice.id==='exchange'&&!choice.plan) {
    prompt=editText('take');
  } else if (choices.length&&(choice.plan||!choice.option)) {
    prompt=gearText(['align','shift'].includes(choice.id)?'chooseDirection':'choose');
  }
  $('equip-prompt').textContent=prompt;
  $('equip-confirm').textContent=message('confirm');
  $('equip-confirm').disabled=!choice.plan;
  $('equip-actions').hidden=choice.id==='scout';
}

function showScout(round) {

  const grid=document.createElement('div');

const ADVANCED_ENEMY_CELLS = false;
const SKILL_ROUNDS = ADVANCED_ENEMY_CELLS ? {exact:9,triple:13} : {};
const ENEMY_PRIORITY = {seal:0, hole:1, heavy:2, persist:3, normal:4, gray:5};
const ENEMY_EFFECTS = [
  [], [], [], ['gray'], [], ['heavy'],
  ['gray'], ['seal','heavy'], ['heavy'],
  ['hole','gray'], ['seal'], ['persist','heavy'],
  ['seal','hole','gray'], ['persist','heavy'],
  ['seal','heavy'], ['hole','persist','gray'],
  ['seal','heavy','heavy'], ['seal','hole','heavy'],
  ['seal','persist','heavy','heavy','gray'],
  ['seal','seal','hole','persist','heavy','heavy','heavy']
];

const HOLLOW_START_ROUND = 3;
const FINAL_HOLLOW_SHARE = .20;

function enemyCards(run,round=run.round) {
  const rng=generator(run.seed,round,1);
  const effects=ADVANCED_ENEMY_CELLS ? ENEMY_EFFECTS[round-1]??[] : [];
  const demand=run.gameMode==='standard' ? STANDARD_DEMAND : ADVANCED_DEMAND;
  const target=demand[round-1];
  const spread=Math.max(1,Math.round(.055*target));
  const area=round===1 ? target : rangeInt(target-spread,target+spread,rng);
  const heavy=effects.filter(effect=>effect==='heavy').length;
  // Hollow markings convert existing cells. Only heavy cells add a damage point.
  const reserve=ADVANCED_ENEMY_CELLS ? round>=16 ? 4 : round>=8 ? 2 : 0 : 0;
  const span=Math.min(MAX_PIECE_SPAN,Math.round((round+4)*.8));
  const enemies=enemyGroups(round,rng,area-heavy-reserve).map((size,index)=>{
    const density=round<=4 ? .48+rng()*.27 : rng()<.14 ? .46+rng()*.13 : .21+rng()*.13;
    return {id:'e'+index,slot:index,cells:rolledShape(size,span,density,rng,round>5 && rng()<.3),marks:{}};
  });
  const markRng=generator(run.seed,round,4);
  const solidSlots=enemies.flatMap(enemy=>enemy.cells.map(cell=>({enemy,cell})));
  const total=solidSlots.length;
  for (const effect of effects) {
    const [{enemy,cell}]=solidSlots.splice(rangeInt(0,solidSlots.length-1,markRng),1);
    enemy.marks[key(...cell)]=effect;
  }
  if (round>=HOLLOW_START_ROUND) {
    const openingShare=2/demand[HOLLOW_START_ROUND-1];
    const progress=(round-HOLLOW_START_ROUND)/(ROUNDS-HOLLOW_START_ROUND);
    const share=openingShare+(FINAL_HOLLOW_SHARE-openingShare)*progress;
    const count=Math.min(solidSlots.length,Math.round(total*share));
    for (let index=0;index<count;index++) {
      const [{enemy,cell}]=solidSlots.splice(rangeInt(0,solidSlots.length-1,markRng),1);
      enemy.marks[key(...cell)]='hollow';
    }
  }
  return enemies;
}

function randomFragment(size,rng) {
  const positions=Array.from({length:size*size},(_,index)=>index);
  const cells=Array.from({length:size},()=>{
    const [position]=positions.splice(rangeInt(0,positions.length-1,rng),1);
    return [position%size,Math.floor(position/size)];
  });
  return normalize(cells);
}

function rewards(run,carry=0,gray=0) {
  const rng=generator(run.seed,run.round,2);
  const round=run.round;
  const area=fragmentArea(round,run.gameMode);
  const fragments=Array.from({length:5+Math.floor((round-1)/4)},()=>randomFragment(area,rng));
  const enemies=nextEncounter(run).slice();
  if (carry) {
    const slot=enemies.length;
    const cells=Array.from({length:carry},(_,index)=>[index,0]);
    enemies.push({id:'e'+slot,slot,cells,marks:{}});
  }
  return {fragments,placements:[],enemies,gray};
}

function slotOrigin(slot,isEnemy,offset=0) {
  const column=slot%2, row=Math.floor(slot/2);
  const columnOffset=trayInset+column*MAX_PIECE_SPAN;
  return {
    x:isEnemy ? FIELD.x+FIELD.size+columnOffset : FIELD.x-MAX_PIECE_SPAN-columnOffset,
    y:SLOT_TOP+row*MAX_PIECE_SPAN+offset
  };
}
function slotPosition(piece,isEnemy,offset=0) {
  const {w,h}=bounds(piece.layoutCells||piece.cells);
  const origin=slotOrigin(piece.slot,isEnemy,offset);
  const inset=(MAX_PIECE_SPAN-w)/2;
  return {
    x:origin.x+(piece.slotOffset?.x ?? (isEnemy ? Math.ceil(inset) : Math.floor(inset))),
    y:origin.y+(piece.slotOffset?.y ?? Math.floor((MAX_PIECE_SPAN-h)/2))
  };
}
function makeTray(cards,kind) {
  return cards.map(card=>{
    const home=slotPosition(card,kind==='enemy');
    return {...card,kind,...home,home};
  });
}

function battleCards(run) {
  return makeTray(run.cards,'card').map(piece=>{
    const eaten=run.eatenNext?.get(piece.id);
    const cells=eaten ? piece.cells.filter(cell=>!eaten.has(key(...cell))) : piece.cells;
    return {
      ...piece, cells:cells.length ? cells : piece.cells,
      layoutCells:eaten ? piece.cells : undefined,
      banned:run.sealNext?.has(piece.id)||!cells.length
    };
  });
}

function startBattle(run,enemies=enemyCards(run)) {
  run.phase='battle';
  run.reward=null;
  delete run.nextEnemies;
  delete run.nextEnemySwaps;
  delete run.nextEnemyUsed;
  delete run.damageHalvings;
  run.temporarilyChangedCards=new Set();
  run.pieces=[...battleCards(run),...makeTray(enemies,'enemy')];
  run.sealNext=new Set();
  run.eatenNext=new Map();
  run.retainedEdges=run.keepEdges??[];
  run.keepEdges=[];
  run.edgeRetentionActive=false;
  run.bonusCells=[];
  run.cast=null;
  run.scouted=run.scoutedRounds.has(run.round+1);
  if (run.gameMode==='experiment') {
    // Leave enough life to try effects that carry into the next battle.
    run.hp=HP+enemies.reduce((total,enemy)=>total+enemy.cells.length,0);
    return;
  }
  const drops=rollPotions(run);
  if (!drops.length) return;
  const carriers=run.pieces.filter(piece=>piece.kind==='enemy').map(piece=>{
    if (piece.pickups) piece.pickups=new Map(piece.pickups);
    const silhouette=new Set(potionSolidify(piece.cells.map(([x,y])=>({x,y})),false).map(({x,y})=>key(x,y)));
    const cells=piece.cells.filter(([x,y])=>piece.marks?.[key(x,y)]!=='hollow'&&!piece.pickups?.has(key(x,y))&&
      CARDINAL.some(([dx,dy])=>!silhouette.has(key(x+dx,y+dy))));
    return {piece,cells};
  }).filter(carrier=>carrier.cells.length>=drops.length);
  const rng=generator(run.seed,run.round,6);
  const carrier=randomItem(carriers,rng);
  if (!carrier) return;
  carrier.piece.pickups??=new Map();
  for (const type of drops) {
    const [cell]=carrier.cells.splice(rangeInt(0,carrier.cells.length-1,rng),1);
    carrier.piece.pickups.set(key(...cell),type);
  }
}

function testCardShapes(rng) {
  const patterns=[
    ['..#######..','.########..','.##.....#..','.##.....###','.##.....###','..#######..','..#######..'],
    ['##.......##','##.......##','##.......##','##.......##','##.......##','###########','###########'],
    ['....###....','....####...','###########','###########','..###......','..###......']
  ];
  const shapes=patterns.map(rows=>normalize(rows.flatMap((row,y)=>
    [...row].flatMap((cell,x)=>cell==='#'?[[x,y]]:[]))));
  shapes.push(...Array.from({length:2},()=>rolledShape(EXPERIMENT_MAX_CARD_AREA,11,.45,rng,false,true)));
  return shapes;
}

const GAME_MODES=['standard','advanced','experiment'];
const SEED_HISTORY_KEY='inhold.seedHistory';
const SEED_HISTORY_LIMIT=10;
let seedHistoryFallback=null;

function readSeedHistory() {
  if (seedHistoryFallback) return seedHistoryFallback;
  try {
    const saved=JSON.parse(localStorage.getItem(SEED_HISTORY_KEY));
    const entries=Array.isArray(saved)?saved:saved?.entries;
    if (!Array.isArray(entries)) return {entries:[]};
    const distinct=new Map();
    for (const entry of entries) {
      const seed=entry?.seed;
      if (!Number.isInteger(seed)||seed!==(seed>>>0)||distinct.has(seed)) continue;
      distinct.set(seed,{seed,favorite:entry.favorite===true});
      if (distinct.size===SEED_HISTORY_LIMIT) break;
    }
    const history=[...distinct.values()];
    const seed=saved?.currentSeed;
    const currentSeed=Number.isInteger(seed)&&seed===(seed>>>0)?seed:history[0]?.seed;
    return {currentSeed,entries:history};
  } catch {
    return {entries:[]};
  }
}

function saveSeedHistory(history) {
  if (!seedHistoryFallback) {
    try {
      localStorage.setItem(SEED_HISTORY_KEY,JSON.stringify(history));
      return;
    } catch {
      // Keep the history available in this page if storage is blocked.
    }
  }
  seedHistoryFallback=history;
}

function rememberSeed(seed) {
  const {entries}=readSeedHistory();
  const played=entries.find(entry=>entry.seed===seed)??{seed,favorite:false};
  const recent=[played,...entries.filter(entry=>entry!==played)];
  if (recent.length>SEED_HISTORY_LIMIT) {
    const oldest=recent.findLastIndex(entry=>!entry.favorite);
    recent.splice(oldest,1);
  }
  saveSeedHistory({currentSeed:seed,entries:recent});
}

function setSeedFavorite(seed,favorite) {
  const history=readSeedHistory();
  const entry=history.entries.find(entry=>entry.seed===seed);
  if (!entry) return false;
  entry.favorite=favorite;
  saveSeedHistory(history);
  return true;
}

function newRun(seed,gameMode='standard') {
  const experiment=gameMode==='experiment';
  seed??=seedValue();
  const rng=generator(seed,1,0);
  const shapes=experiment ? testCardShapes(rng) : Array.from({length:3},()=>walk(START_CARD_AREA,3,rng,true));
  const cards=shapes.map((cells,slot)=>({id:'p'+slot,slot,cells}));
  const run={seed,gameMode,round:experiment?EXPERIMENT_START_ROUND:1,hp:HP,phase:'battle',reward:null,cards,
    potions:experiment?Object.keys(POTIONS).flatMap(id=>Array(MAX_POTION_STACK).fill(id)):[],scoutedRounds:new Set()};
  startBattle(run);
  return run;
}

function active(piece) {
  return !piece.inactive&&!piece.banned&&piece.cells.some(([x,y])=>inDefense(piece.x+x,piece.y+y));
}
function deployment(run) {
  const deployed=new Set();
  for (const piece of run.pieces) {
    if (piece.kind==='card'&&!piece.free&&active(piece)) deployed.add(piece.sourceId??piece.id);
  }
  const count=deployed.size;
  const limit=deployLimit(run.round);
  return {count,limit,overLimit:count>limit};
}

function settlement(run) {
  const coverings=new Map(), stacks=new Map(), hollowOwners=new Map(), bonus=new Set();
  const pickups=[];
  for (const piece of run.pieces) {
    if (piece.inactive||piece.banned) continue;
    for (const cell of piece.cells) {
      const [x,y]=cell;
      const xx=x+piece.x, yy=y+piece.y, id=key(xx,yy), local=key(x,y);
      if (piece.kind==='enemy') {
        const potion=piece.pickups?.get(local);
        if (potion) pickups.push({x:xx,y:yy,piece,cell:local,type:potion});
        const type=piece.marks?.[local]||'normal';
        const groups=type==='hollow' ? hollowOwners : stacks;
        const group=groups.get(id)||[];
        group.push({piece,type});
        groups.set(id,group);
      } else if (inDefense(xx,yy)) {
        const group=coverings.get(id)||[];
        group.push({piece,local,depth:piece.double?.has(local) ? 2 : 1});
        coverings.set(id,group);
      }
    }
  }
  const retained=new Set(retainedEdgeCells(run.retainedEdges).map(([x,y])=>key(x,y)));
  for (const id of retained) bonus.add(id);
  for (const [x,y] of run.bonusCells??[]) {
    if (inDefense(x,y)) bonus.add(key(x,y));
  }
  const shield=new Set([...coverings.keys(),...bonus]);
  const touchesEdge=(x,y)=>CARDINAL.some(([dx,dy])=>{
    const neighbor=key(x+dx,y+dy);
    return (retained.has(neighbor)&&!retained.has(key(x,y)))||
      coverings.get(neighbor)?.some(({piece})=>
        !piece.cells.some(([u,v])=>piece.x+u===x&&piece.y+v===y));
  });
  const enemies=new Map(), uncovered=new Map(), absorbed=new Set(), hollows=new Map();
  const remainingTypes=new Map(), resolvedTypes=new Map(), unclean=new Set();
  const sealed=new Set(), eaten=new Map(), consumed=[];
  let damage=0, carry=0, gray=0;
  for (const [id,owners] of hollowOwners) {
    const stack=stacks.get(id);
    if (stack) {
      // A group of coincident hollows adds exactly one ordinary layer.
      stack.push({piece:owners[0].piece,type:'normal',hollowOwners:owners});
      continue;
    }
    const [x,y]=id.split(',').map(Number);
    const resolved=touchesEdge(x,y);
    hollows.set(id,{resolved});
    if (!resolved) {
      damage++;
      for (const {piece} of owners) unclean.add(piece.id);
    }
  }
  for (const [id,layers] of stacks) {
    const count=layers.length;
    const covers=coverings.get(id)||[];
    const available=Math.min(count,Math.max(bonus.has(id) ? 1 : 0,...covers.map(cover=>cover.depth)));
    layers.sort((a,b)=>ENEMY_PRIORITY[a.type]-ENEMY_PRIORITY[b.type]||
      Number(Boolean(a.hollowOwners))-Number(Boolean(b.hollowOwners))||a.piece.slot-b.piece.slot);
    enemies.set(id,count);
    if (available) {
      absorbed.add(id);
      resolvedTypes.set(id,layers[0].type);
    }
    if (available<count) {
      uncovered.set(id,count-available);
      remainingTypes.set(id,layers[available].type);
    }
    const overlapping=covers.length+(bonus.has(id) ? 1 : 0)>1;
    for (const [index,layer] of layers.entries()) {
      if (overlapping||index>=available) {
        unclean.add(layer.piece.id);
        if (layer.hollowOwners) for (const {piece} of layer.hollowOwners) unclean.add(piece.id);
      }
      if (index<available) consumed.push({layer,covers});
      else {
        damage+=layer.type==='heavy' ? 2 : 1;
        if (layer.type==='persist') carry++;
      }
    }
  }
  for (const {layer,covers} of consumed) {
    const {type,piece}=layer;
    if (type==='gray') {
      gray=1;
      continue;
    }
    if (type!=='seal'&&type!=='hole') continue;
    if (run.round>=SKILL_ROUNDS.exact&&!unclean.has(piece.id)) continue;
    const realCards=covers.filter(cover=>!cover.piece.free);
    const sourceIds=new Set(realCards.map(({piece})=>piece.sourceId??piece.id));
    if (type==='seal'&&run.round>=SKILL_ROUNDS.triple&&sourceIds.size>=3) continue;
    for (const cover of realCards) {
      const sourceId=cover.piece.sourceId??cover.piece.id;
      if (type==='seal') {
        sealed.add(sourceId);
      } else {
        const original=cover.piece.sourceCells ? cover.piece.sourceCells.get(cover.local) : cover.local;
        if (original===undefined) continue;
        const cells=eaten.get(sourceId)||new Set();
        cells.add(original);
        eaten.set(sourceId,cells);
      }
    }
  }
  const stock=new Map();
  if (pickups.length) for (const type of run.potions??[]) stock.set(type,(stock.get(type)??0)+1);
  for (const pickup of pickups) {
    const count=stock.get(pickup.type)??0;
    pickup.collected=count<MAX_POTION_STACK&&
      (coverings.has(key(pickup.x,pickup.y))||retained.has(key(pickup.x,pickup.y))||touchesEdge(pickup.x,pickup.y));
    if (pickup.collected) stock.set(pickup.type,count+1);
  }
  return {
    damage:Math.floor(damage/2**(run.damageHalvings??0)),
    absorbed,uncovered,enemies,shield,remainingTypes,resolvedTypes,hollows,
    sealed,eaten,carry,gray,pickups,

function growSmallestCard(run,cards) {

  const smallest=Math.min(...cards.map(card=>card.cells.length));
  const card=randomItem(cards.filter(candidate=>candidate.cells.length===smallest),rng);
  const occupied=new Set(card.cells.map(cell=>key(...cell)));
  const {frame,anchor}=cardEditSlot(card);
  const empty=new Map();
  for (const [x,y] of card.cells) for (const [dx,dy] of CARDINAL) {
    const u=x+dx, v=y+dy, id=key(u,v);
    if (occupied.has(id)||!inSlotFrame(frame,anchor.x+u,anchor.y+v)) continue;
    empty.set(id,[u,v]);
  }
  if (!empty.size) return;
  const [u,v]=randomItem([...empty.values()],rng);
  const shiftX=Math.min(0,u), shiftY=Math.min(0,v);
  const eaten=run.eatenNext?.get(card.id);
  if (card.double) card.double=shiftedKeys(card.double,shiftX,shiftY);
  if (eaten) run.eatenNext.set(card.id,shiftedKeys(eaten,shiftX,shiftY));
  card.cells=normalize([...card.cells,[u,v]]);

  const cards=run.cards.map(card=>{
    const {localShift,...upgrade}=changes.get(card.id)||{};
    const updated={...card,...upgrade};
    if (localShift) {
      const [dx,dy]=localShift;
      const eaten=run.eatenNext?.get(card.id);
      if (eaten) run.eatenNext.set(card.id,shiftedKeys(eaten,dx,dy));

    const unavailable=piece.banned||piece.inactive;
    const anchor=unavailable&&boardRun.phase!=='reward' ? piece.home??piece : piece;
    const highlighted=!showingSettlement&&piece===drag?.piece;
    for (const [x,y] of piece.cells) {

      const inside=inDefense(xx,yy);
      if (showingSettlement&&inside) continue;
      const color=unavailable ? '#b4b4b4' : inside ? boardColors.card : '#737373';
      ctx.fillStyle=dragColor(color,highlighted);
      square(ctx,xx,yy,unit,pixelRatio);
      if (!unavailable&&piece.double?.has(key(x,y))) {

function draw(fade=null) {

  ctx.translate(-viewLeft*unit,0);
  ctx.fillStyle=boardColors.paper;
  ctx.fillRect(FIELD.x*unit,FIELD.y*unit,FIELD.size*unit,FIELD.size*unit);
  drawCardPieces(boardRun,showingSettlement);
  if (boardRun.phase==='reward') {
    drawUpgrade();
    return;
  }
  const current=fade?.result||settlement(boardRun);
  const draggedCells=new Map();
  if (!showingSettlement&&drag) {
    const {piece}=drag;
    for (const [x,y] of piece.cells) draggedCells.set(key(piece.x+x,piece.y+y),pieceCellType(piece,x,y));
  }
  if (fade&&fade.blackProgress<1) {
    for (const id of current.shield) {
      const [x,y]=id.split(',').map(Number);
      drawDissolve(x,y,fade.blackProgress,fade.patterns.get(id),boardColors.card);
    }
  }
  const dotRatio=.15;
  const dot=Math.max(1,unit*dotRatio);
  for (const id of current.absorbed) {
    if (showingSettlement||current.uncovered.has(id)) continue;
    const [x,y]=id.split(',').map(Number);
    const ink=enemyPaint[current.resolvedTypes?.get(id)]??enemyPaint.normal;
    if (mode) drawBattleCell(x,y,resolvedEnemyColor(ink),draggedCells.get(id));
    ctx.fillStyle='#d0d0d0';
    drawMark(x,y,dot);
  }

  const devicePixel=1/pixelRatio;
  const maxMarkSize=Math.min(unit-2*devicePixel,unit*maxMarkRatio);
  const markGrowth=(maxMarkRatio-dotRatio)/(maxMarkLayers-minMarkLayers);
  const redProgress=fade?.redProgress??0;
  const hidingResult=ended&&$('info').open&&!reduced.matches;
  ctx.globalAlpha=hidingResult ? 0 : 1;
  for (const [id,layers] of current.uncovered) {
    const [x,y]=id.split(',').map(Number);
    const absorbed=current.absorbed.has(id);
    const ink=enemyPaint[current.remainingTypes?.get(id)]??enemyPaint.normal;
    const partial=!showingSettlement&&absorbed;
    const color=partial&&mode==='card' ? ink.partialCard : partial&&mode==='enemy' ? ink.partialEnemy : ink.base;
    const pattern=fade?.patterns.get(id);
    if (redProgress) drawDissolve(x,y,redProgress,pattern,color);
    else drawBattleCell(x,y,color,draggedCells.get(id));
    if (maxMarkSize<devicePixel||layers<minMarkLayers) continue;
    const markRatio=dotRatio+(layers-minMarkLayers)*markGrowth;
    const size=Math.min(maxMarkSize,Math.max(dot,unit*markRatio));
    if (redProgress) drawDissolve(x,y,redProgress,pattern,ink.stack,size);
    else {
      ctx.fillStyle=ink.stack;
      drawMark(x,y,size);
    }
  }
  for (const [id,{resolved}] of current.hollows??[]) {
    if (showingSettlement&&resolved) continue;
    const [x,y]=id.split(',').map(Number);
    const ink=enemyPaint.normal;
    ctx.save();
    if (!resolved&&redProgress) ctx.globalAlpha*=1-redProgress;
    const color=resolved ? resolvedEnemyColor(ink) : ink.base;
    drawCellRim(x,y,dragColor(color,draggedCells.get(id)==='hollow'));
    ctx.restore();
  }
  ctx.globalAlpha=1;
  if (!showingSettlement) {
    for (const pickup of current.pickups) drawPickup(pickup,pickup.collected);
    ctx.fillStyle='#a4a4a4';
    const pixel=1/pixelRatio;
    const liveEdges=run.edgeRetentionActive ? current.nextEdges : [];
    for (const [x,y,dx,dy] of [...boardRun.retainedEdges,...liveEdges]) {
      ctx.fillRect((x+dx)*unit-dx*pixel,(y+dy)*unit-dy*pixel,dx?2*pixel:unit,dy?2*pixel:unit);
    }
    drawPotionOverlay();
  }
}

  const size=2*center+1;
  const arm=1+Math.round((Math.round(radius*.6)-1)*Math.SQRT1_2);
  for (const [name,distance,dimmed] of [
    ['--grab',hoverRadius],['--grabbing',radius],
    ['--grab-hover-dimmed',hoverRadius,true],['--grab-held-dimmed',radius,true]
  ]) {
    const colors=dimmed?['','rgba(0,0,0,.7)','rgba(255,255,255,.5)']:['','#000','#fff'];
    icon.width=icon.height=size*scale;
    const pixels=new Uint8Array(size*size);
    const mark=(x,y)=>{
      for (let dy=-1;dy<=1;dy++) for (let dx=-1;dx<=1;dx++) pixels[(y+dy)*size+x+dx]||=1;
      pixels[y*size+x]=2;

canvas.addEventListener('keydown',event=>{
  if (!battleReady()||drag||potionChoice?.edit) return;
  if (potionKey(event)) return;
  if (event.key==='1'||event.key==='2') {
    setMode(event.key==='1'?'card':'enemy');
    refresh();
    return;
  }
  const piece=run.pieces.find(p=>p.id===selected);
  if (!piece||piece.banned||piece.inactive) return;
  const moves={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]};
  if (moves[event.key]) {
    event.preventDefault();
    const [dx,dy]=moves[event.key];
    movePiece(piece,piece.x+dx,piece.y+dy);
    if (!active(piece)) returnToSlot(piece);
    saveRun();
    refresh();
  }
});

function showInfo(title,content,buttons) {
  hideHoverTip();
  const target=$('info');
  target.dataset.topic=title;
  $('info-title').textContent=message(title);
  const dismiss=buttons.find(([text])=>text==='close'||text==='keepPlaying');
  const closeButton=$('info-close');
  closeButton.hidden=!dismiss;
  if (dismiss) {
    const [text,action]=dismiss;
    closeButton.setAttribute('aria-label',message(text));
    closeButton.onclick=()=>{target.close();action?.();};
  }
  $('info-body').replaceChildren(...content.map(item=>{
    if (typeof item!=='string') return item;
    const p=document.createElement('p');p.textContent=item;return p;
  }));
  const footer=buttons.filter(button=>button!==dismiss);
  $('info-actions').replaceChildren(...footer.map(([text,action],i)=>{
    const button=document.createElement('button');
    button.className=i===footer.length-1?'action':'quiet';
    button.textContent=message(text);button.onclick=()=>{target.close();action?.();};return button;
  }));
  if (!target.open) target.showModal();
}
$('help').onclick=()=>showInfo('help',battleHelpParagraphs(),[['close']]);
$('potion-guide').onclick=()=>{
  const list=document.createElement('ul');
  list.className='potion-guide';
  for (const [id,potion] of Object.entries(POTIONS)) {
    const [name,description]=potion[gearLanguage()];
    const item=document.createElement('li');
    const icon=createPotionIcon(id,GUIDE_ICON_PIXELS);
    const text=document.createElement('div');
    const title=document.createElement('h3');
    title.textContent=name;
    const detail=document.createElement('p');
    detail.textContent=description;
    text.append(title,detail);
    item.append(icon,text);
    list.append(item);
  }
  showInfo('potionGuide',[],[['close']]);
  const body=$('info-body');
  body.replaceChildren(list);
  body.scrollTop=0;
  snapPotionIcons(list);
};
function showRun(next) {
  cancelAnimationFrame(frameAnimation);
  clearTimeout(giftTimer);
  displayedHp=null;
  frameAnimation=0;locked=false;drag=null;selected=null;giftNotice=0;
  upgradeDrag=null;trayOffset=maxTrayOffset;
  delete frame.dataset.sideFlash;
  setMode('');
  discardPotion(false);
  gearStamp='';
  run=next;
  resize();
}
function beginRun(seed,gameMode,slot=activeSaveSlot) {
  const next=newRun(seed,gameMode);
  currentSeed=next.seed;
  roundStarts=[structuredClone(next)];
  rememberSeed(currentSeed);
  showRun(next);
  if (slot!==activeSaveSlot) selectSaveSlot(slot);
  saveRun();
}
function undoRoundStart() {
  const start=roundStarts.at(-1);
  if (!start||run.phase!=='battle') return start;
  const usedItem=run.potions.length!==start.potions.length;
  const movedPiece=run.pieces.some(piece=>piece.x!==piece.home.x||piece.y!==piece.home.y);
  return usedItem||movedPiece ? start : roundStarts.at(-2);
}
function showUndoRound() {
  const start=undoRoundStart();
  if (!start||locked||drag||upgradeDrag) return;
  showInfo('undoRound',[message('undoRoundPrompt',start.round)],[['keepPlaying'],['confirm',()=>{
    const restored=structuredClone(start);
    if (start!==roundStarts.at(-1)) roundStarts.pop();
    showRun(restored);
    saveRun();
    canvas.focus({preventScroll:true});
  }]]);
}
$('undo-round').onclick=showUndoRound;

const SEED_ALPHABET='0123456789ABCDEFGHJKMNPQRSTVWXYZ';

function seedName(seed) {
  const name=document.createElement('span');
  name.className='seed-name';
  const parts=[seed>>>21,(seed>>>11)&0x3ff,seed&0x7ff];
  if (language==='en') {
    const groups=parts.map((part,index)=>{
      const digits=part.toString(32).padStart(index===1?2:3,'0');
      return Array.from(digits,digit=>SEED_ALPHABET[parseInt(digit,32)]).join('');
    });
    name.textContent=groups.join('·');
  } else {
    name.lang='zh-CN';
    name.textContent=parts.map(part=>SEED_WORDS[part]).join('·');
  }
  return name;
}

function parseSeedName(text) {
  const code=text.replace(/[\s·]/g,'');
  let parts;
  if (code.length===6) {
    const words=[code.slice(0,2),code.slice(2,4),code.slice(4)];
    parts=words.map(word=>SEED_WORDS.indexOf(word));
  } else if (/^[0-9a-z]{8}$/i.test(code)) {
    const groups=[code.slice(0,3),code.slice(3,5),code.slice(5)];
    parts=groups.map(group=>{
      let part=0;
      for (const char of group.toUpperCase()) {
        const digit=SEED_ALPHABET.indexOf(char);
        if (digit<0) return -1;
        part=part*32+digit;
      }
      return part;
    });
  } else {
    return null;
  }
  const [first,second,third]=parts;
  if (first<0||first>=2048||second<0||second>=1024||third<0||third>=2048) return null;
  return ((first<<21)|(second<<11)|third)>>>0;
}

function restartOption(group,value,text,checked=false) {
  const row=document.createElement('label');
  row.className='restart-choice';
  const choice=document.createElement('input');
  choice.type='radio';
  choice.name=group;
  choice.value=value;
  choice.checked=checked;
  row.append(choice,text);
  return row;
}
function showSaveSlots() {
  if (locked||drag||upgradeDrag) return;
  const list=document.createElement('div');
  list.className='save-slots';
  for (let slot=0;slot<SAVE_SLOT_COUNT;slot++) {
    const current=slot===activeSaveSlot;
    const save=current?{run,currentSeed}:readRunSave(slot);
    const row=document.createElement('button');
    row.type='button';
    row.className='save-slot';
    const name=document.createElement('span'), progress=document.createElement('span');
    name.textContent=message('saveSlot',slot+1);
    if (current) row.setAttribute('aria-current','true');
    if (save) {
      const {gameMode,round,phase}=save.run;
      const stage=phase==='won'||phase==='lost'?message('endedSlot'):gearRound(round);
      progress.textContent=message(gameMode)+' · '+stage;
    } else progress.textContent=message('emptySlot');
    row.append(name,progress);
    if (save) {
      const seed=seedName(save.currentSeed);
      if (save.run.gameMode==='experiment') seed.style.visibility='hidden';
      row.append(seed);
    }
    row.onclick=()=>{
      $('info').close();
      if (!current) {
        const next=readRunSave(slot);
        if (next) {
          selectSaveSlot(slot);
          currentSeed=next.currentSeed;
          roundStarts=next.roundStarts;
          showRun(next.run);
          terminal();
        } else beginRun(currentSeed,run.gameMode,slot);
      }
      if (!$('info').open) canvas.focus({preventScroll:true});
    };
    list.append(row);
  }
  const content=[list];
  if (saveUnavailable||unsavedSlots.size) content.push(message('saveUnavailable'));
  showInfo('saveSlots',content,[['close']]);
  $('info-body').scrollTop=0;
}

function showRestart() {
  if (locked||drag||upgradeDrag) return;
  const openingMode=document.createElement('fieldset');
  openingMode.className='opening-mode';
  openingMode.setAttribute('aria-label',message('openingMode'));
  openingMode.append(...GAME_MODES.map(gameMode=>
    restartOption('restart-mode',gameMode,message(gameMode),gameMode===run.gameMode)));

  const {entries:history}=readSeedHistory();
  let selectedSeed=currentSeed;
  const seedPreview=document.createElement('output');
  seedPreview.append(seedName(selectedSeed));

  const options=document.createElement('fieldset');
  options.className='seed-choices';
  options.setAttribute('aria-label',message('recentSeeds'));
  const seedHistory=document.createElement('div');
  seedHistory.className='seed-history';
  seedHistory.append(...history.map(({seed,favorite})=>{
    const row=restartOption('restart-seed',String(seed),seedName(seed),seed===currentSeed);
    row.insertAdjacentHTML('beforeend',`<svg class="seed-favorite" width="10" height="10" viewBox="0 0 10 10" fill="currentColor" shape-rendering="crispEdges" aria-hidden="true">
      <path d="M4 0h2v2H4z M2 2h2v2H2z M6 2h2v2H6z M0 4h2v2H0z M8 4h2v2H8z M2 6h2v2H2z M6 6h2v2H6z M4 8h2v2H4z"/>
    </svg>`);
    row.toggleAttribute('data-favorite',favorite);
    return row;
  }));
  const selectSeed=seed=>{
    if (seed===selectedSeed) return;
    const selected=seedHistory.querySelector('input[type="radio"]:checked');
    if (selected && Number(selected.value)!==seed) selected.checked=false;
    selectedSeed=seed;
    seedPreview.replaceChildren(seedName(seed));
  };
  let editingFavorites=false;
  seedHistory.onchange=({target:choice})=>{
    const seed=Number(choice.value);
    if (!editingFavorites) {
      selectSeed(seed);
      return;
    }
    const row=choice.parentElement;
    if (setSeedFavorite(seed,choice.checked)) row.toggleAttribute('data-favorite',choice.checked);
    else choice.checked=row.hasAttribute('data-favorite');
  };
  const editFavorites=document.createElement('button');
  editFavorites.type='button';
  editFavorites.className='quiet edit-favorites';
  editFavorites.textContent=message('editFavorites');
  editFavorites.onclick=()=>{
    editingFavorites=!editingFavorites;
    editFavorites.textContent=message(editingFavorites?'done':'editFavorites');
    for (const choice of seedHistory.querySelectorAll('input')) {
      choice.checked=false;
      choice.type=editingFavorites?'checkbox':'radio';
      choice.checked=editingFavorites?choice.parentElement.hasAttribute('data-favorite'):Number(choice.value)===selectedSeed;
    }
  };
  const rollSeed=document.createElement('button');
  rollSeed.type='button';
  rollSeed.className='quiet';
  rollSeed.textContent=message('randomSeed');
  rollSeed.onclick=()=>selectSeed(seedValue());
  const openingSeeds=document.createElement('dl');
  openingSeeds.className='opening-seeds';
  const currentLabel=document.createElement('dt');
  currentLabel.textContent=message('currentSeed');
  const currentValue=document.createElement('dd');
  currentValue.append(seedName(currentSeed));
  const nextLabel=document.createElement('dt');
  nextLabel.textContent=message('nextSeed');
  const nextValue=document.createElement('dd');
  nextValue.append(seedPreview,rollSeed);
  const seedInput=document.createElement('input');
  seedInput.id='restart-seed-input';
  seedInput.className='seed-input';
  seedInput.maxLength=10;
  seedInput.autocomplete='off';
  seedInput.spellcheck=false;
  const confirmSeed=document.createElement('button');
  confirmSeed.type='button';
  confirmSeed.className='quiet';
  confirmSeed.textContent=message('confirm');
  confirmSeed.onclick=()=>{
    const seed=parseSeedName(seedInput.value);
    if (seed!==null) selectSeed(seed);
  };
  seedInput.onkeydown=event=>{
    if (event.key==='Enter'&&!event.isComposing) confirmSeed.click();
  };
  const seedInputLabel=document.createElement('label');
  seedInputLabel.htmlFor=seedInput.id;
  seedInputLabel.textContent=message('enterSeed');
  const inputTerm=document.createElement('dt');
  inputTerm.append(seedInputLabel);
  const inputValue=document.createElement('dd');
  inputValue.append(seedInput,confirmSeed);
  openingSeeds.append(currentLabel,currentValue,nextLabel,nextValue,inputTerm,inputValue);
  options.append(seedHistory);
  showInfo('restartTitle',[openingMode,openingSeeds,options],[['keepPlaying'],['restartSlot',()=>{
    const gameMode=openingMode.querySelector('input:checked').value;
    beginRun(selectedSeed,gameMode);
  }]]);
  $('info-actions').prepend(editFavorites);
  $('info-body').scrollTop=0;
}
$('save-slots').onclick=showSaveSlots;
$('reset').onclick=showRestart;

function terminal() {
  if (!['won','lost'].includes(run.phase)) return;
  const won=run.phase==='won';
  showInfo(won?'won':'lost',[won?message('remainingLife',run.hp):message('reachedRound',run.round)],
    [['viewBattlefield'],['undoRound',showUndoRound],['newRun',showRestart]]);
  $('info').addEventListener('close',refresh,{once:true});
}
function runSettlement() {
  if (!battleReady()||drag||potionChoice||deployment(run).overLimit) return;
  locked=true;updateStatus();
  const result=settlement(run);
  const lifeLoss=Math.min(run.hp,result.damage);
  const completed=()=>{
    locked=false;frameAnimation=0;selected=null;
    displayedHp=null;
    finishBattle(run,result);
    saveRun();
    if (run.phase==='reward') openUpgrade();
    else {
      terminal();
      refresh();
    }
  };
  const pendingDamage=result.uncovered.size||[...result.hollows.values()].some(cell=>!cell.resolved);
  if (reduced.matches||(!result.shield.size&&!pendingDamage)) {completed();return;}
  const dissolveMs=300;
  const redDelayMs=pendingDamage ? 200 : 0;
  const duration=dissolveMs+redDelayMs;
  const ids=new Set([...result.shield,...result.uncovered.keys()]);
  const patterns=new Map([...ids].map(id=>[id,rangeInt(0,DISSOLVE_PATTERNS-1,Math.random)]));
  const cellPixels=Math.round(unit*pixelRatio);
  if (result.shield.size) dissolveStrip(boardColors.card,cellPixels);
  if (result.uncovered.size) {
    dissolveStrip(boardColors.enemy,cellPixels);
    dissolveStrip('#700000',cellPixels);
  }
  const start=performance.now();
  function tick(now) {
    const elapsed=now-start;
    if (elapsed>=duration) {completed();return;}
    const blackProgress=clamp(elapsed/dissolveMs,0,1);
    const redElapsed=elapsed-redDelayMs;
    const redProgress=clamp(redElapsed/dissolveMs,0,1);
    if (lifeLoss&&redElapsed>=0) {
      displayedHp=run.hp-Math.floor(lifeLoss*clamp(redElapsed/150,0,1));
      updateLife();
    }
    draw({result,patterns,blackProgress,redProgress});
    frameAnimation=requestAnimationFrame(tick);
  }
  frameAnimation=requestAnimationFrame(tick);
}
$('settle').onclick=runSettlement;

function fragmentThumbnail(cells,held) {
  const thumb=document.createElement('canvas');
  cursorCells.set(thumb,new Set());
  const side=Math.round(FRAGMENT_TILE_SPAN*unit*pixelRatio);
  thumb.width=side;thumb.height=side;thumb.setAttribute('aria-hidden','true');
  const context=thumb.getContext('2d'),{w,h}=bounds(cells);
  const left=Math.floor((FRAGMENT_TILE_SPAN-w)/2),top=Math.floor((FRAGMENT_TILE_SPAN-h)/2);
  context.setTransform(pixelRatio,0,0,pixelRatio,0,0);
  context.fillStyle=dragColor(upgradeColors.fragment,held);
  for (const [x,y] of cells) square(context,left+x,top+y,unit,pixelRatio);
  return thumb;
}
function upgradeCardAt(x,y) {
  return run.pieces.find(piece=>{
    if (piece.kind!=='card') return false;
    const origin=slotOrigin(piece.slot,false,trayOffset);
    return x>=origin.x&&x<origin.x+MAX_PIECE_SPAN&&y>=origin.y&&y<origin.y+MAX_PIECE_SPAN;
  });
}
function cardPlacement(id) {return run.reward.placements.find(placement=>placement.card===id);}
function placedFragmentAt(x,y) {
  const column=Math.floor(x), row=Math.floor(y);
  return run.reward.placements.find(placement=>{
    const [left,top]=placement.origin;
    return placement.fragmentCells.some(([u,v])=>left+u===column&&top+v===row);
  });
}
function openUpgrade() {
  upgradeDrag=null;
  for (const piece of run.pieces) if (piece.kind==='card') returnToSlot(piece);
  resize();
}
function paintUpgradeOptions() {
  const list=$('fragments');
  const usedFragments=new Set(run.reward.placements.map(placement=>placement.fragment));
  list.replaceChildren(...run.reward.fragments.map((cells,index)=>{
    const used=usedFragments.has(index);
    const button=document.createElement('button');
    button.type='button';button.className='choice';button.tabIndex=-1;
    button.setAttribute('aria-label',message('fragmentLabel',used));
    button.classList.toggle('used',used);
    button.append(fragmentThumbnail(cells,upgradeDrag?.fromOptions&&upgradeDrag.fragment===index));
    button.addEventListener('pointerdown',event=>{
      const [x,y]=point(event,button,unit);
      const {w,h}=bounds(cells);
      const left=Math.floor((FRAGMENT_TILE_SPAN-w)/2);
      const top=Math.floor((FRAGMENT_TILE_SPAN-h)/2);
      const grip=[clamp(Math.floor(x)-left,0,w-1),clamp(Math.floor(y)-top,0,h-1)];
      startFragmentDrag(event,index,grip,true);
    });
    return button;
  }));
  refresh();
}

function startFragmentDrag(event,fragment,grip,fromOptions=false) {
  if (event.button!==0||run.phase!=='reward'||upgradeDrag||$('info').open) return;
  event.preventDefault();
  const start=point(event,canvas,unit).map(Math.floor);
  const cells=run.reward.fragments[fragment];
  upgradeDrag={id:event.pointerId,fragment,cells,grip,start,fromOptions,moved:false};
  frame.setPointerCapture(event.pointerId);
  if (fromOptions) paintUpgradeOptions();
  else refresh();
}
function moveFragmentDrag(event) {
  const [x,y]=point(event,canvas,unit).map(Math.floor);
  const {start,grip,fragment,cells}=upgradeDrag;
  if (x!==start[0]||y!==start[1]) upgradeDrag.moved=true;
  const origin=[x-grip[0],y-grip[1]];
  const overlapping=cells.map(([u,v])=>upgradeCardAt(origin[0]+u,origin[1]+v)).filter(Boolean);
  const underPointer=upgradeCardAt(x,y);
  const card=overlapping.includes(underPointer)?underPointer:overlapping[0];
  const proposal=card&&upgradePlacement(card,fragment,origin,cells);
  Object.assign(upgradeDrag,{card,origin,proposal});
}
frame.addEventListener('pointermove',event=>{
  if (upgradeDrag?.id!==event.pointerId) return;
  moveFragmentDrag(event);
  refresh();
});
function releaseFragment(event) {
  if (upgradeDrag?.id!==event.pointerId) return;
  const dropped=event.type==='pointerup';
  if (dropped) moveFragmentDrag(event);
  const {fragment,moved,card,origin,proposal,fromOptions}=upgradeDrag;
  upgradeDrag=null;
  if (dropped&&moved) {
    if (!proposal?.clipped.length) run.reward.placements=run.reward.placements.filter(item=>item.fragment!==fragment);
    else if (proposal?.valid) placeUpgradeFragment(card,fragment,origin,proposal.clipped);
    saveRun();
  }
  if (fromOptions||(dropped&&moved)) paintUpgradeOptions();
  else refresh();
}
frame.addEventListener('pointerup',releaseFragment);
frame.addEventListener('pointercancel',releaseFragment);
frame.addEventListener('lostpointercapture',releaseFragment);
for (const type of ['pointerdown','pointermove','pointerup']) document.addEventListener(type,drawGrabCursor);
cursorRoot.addEventListener('pointerleave',hideGrabCursor);
document.addEventListener('pointercancel',hideGrabCursor);
window.addEventListener('blur',hideGrabCursor);

function upgradePlacement(card,index,[x,y],cells) {
  const slot=slotOrigin(card.slot,false,trayOffset);
  const placed=cardPlacement(card.id);
  const occupied=Boolean(placed&&placed.fragment!==index);
  const clipped=cells.filter(([u,v])=>{
    const xx=x+u, yy=y+v;
    return xx>=viewLeft&&xx<viewRight&&yy>=0&&yy<HEIGHT&&
      xx>=slot.x&&xx<slot.x+MAX_PIECE_SPAN&&yy>=slot.y&&yy<slot.y+MAX_PIECE_SPAN;
  });
  return {valid:clipped.length>0&&!occupied,occupied,clipped};
}
function placeUpgradeFragment(card,index,origin,fragmentCells) {
  const [x,y]=origin;
  const patch=fragmentCells.map(([u,v])=>[x-card.x+u,y-card.y+v]);
  const combined=card.cells.concat(patch);
  const cells=normalize(combined);
  const localShift=[Math.min(...combined.map(([u])=>u)),Math.min(...combined.map(([,v])=>v))];
  const slot=slotOrigin(card.slot,false,trayOffset);
  const slotOffset={
    x:Math.min(card.x,...fragmentCells.map(([u])=>x+u))-slot.x,
    y:Math.min(card.y,...fragmentCells.map(([,v])=>y+v))-slot.y
  };
  const placements=run.reward.placements.filter(item=>item.fragment!==index);
  placements.push({card:card.id,fragment:index,origin,fragmentCells,upgrade:{cells,slotOffset,localShift}});
  run.reward.placements=placements;
}
function drawUpgradeFragment(card,cells,[x,y],held=false) {
  const occupied=!held&&card&&new Set(card.cells.map(cell=>key(...cell)));
  const color=dragColor(upgradeColors.fragment,held);
  for (const [u,v] of cells) {
    const xx=x+u, yy=y+v;
    const overlap=occupied&&occupied.has(key(xx-card.x,yy-card.y));
    ctx.fillStyle=overlap ? upgradeColors.overlap : color;
    square(ctx,xx,yy,unit,pixelRatio);
  }
}
function drawUpgrade() {
  drawUpcomingEnemies();

  const moving=upgradeDrag?.moved ? upgradeDrag : null;
  for (const placement of run.reward.placements) {
    if (placement.fragment===moving?.fragment) continue;
    const target=run.pieces.find(piece=>piece.id===placement.card);
    const held=placement.fragment===upgradeDrag?.fragment&&!upgradeDrag.fromOptions;
    drawUpgradeFragment(target,placement.fragmentCells,placement.origin,held);
  }
  if (moving) {
    const {cells,origin,proposal}=moving;
    drawUpgradeFragment(null,proposal?.clipped??cells,origin,true);
  }
  for (const piece of run.pieces) {
    if (piece.kind==='card') drawSlotFrame(slotOrigin(piece.slot,false,trayOffset));
  }
}
function drawSlotFrame({x,y}) {
  const side=MAX_PIECE_SPAN*unit;
  ctx.strokeStyle='#a4a4a4';
  ctx.lineWidth=1/pixelRatio;
  ctx.strokeRect(x*unit,y*unit,side,side);
}
function upgradeHint() {
  if (upgradeDrag?.proposal?.occupied) {
    return message('occupiedSlot');
  }
  return message('upgradeHint');
}
$('advance').onclick=()=>{
  if (run.phase!=='reward') return;
  discardPotion(false);
  upgradeDrag=null;
  selected=null;giftNotice=0;
  setMode('');
  const gift=nextRound(run);
  roundStarts.push(structuredClone(run));
  saveRun();
  if (gift) announceGift(gift.cells.length);
  resize();
  canvas.focus({preventScroll:true});
};
window.addEventListener('resize',resize);
installGameScrollbars();
$('info-body').addEventListener('scroll',()=>{
  const list=$('info-body').querySelector('.potion-guide');
  if (list) snapPotionIcons(list);
},{passive:true});
watchPixelRatio();
applyLanguage();
if (loadedSave) terminal();
document.fonts.ready.then(resize);
</script>
</body>
</html>
